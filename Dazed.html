<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dazed</title>
<style>
:root{--bg:#0a0908;--panel:#1b1512;--accent:#8a1f1f;--accent2:#c9a227;--text:#e8dfd0;--hp:#b32020;--exp:#d4af37;--line:#3a2f28;color-scheme:dark;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0a0908;}}
:root[data-theme="dark"]{--bg:#0a0908;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Courier New',monospace;}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px);}
#wrap{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;background:#000;overflow:hidden;border:2px solid var(--line);box-shadow:0 0 40px rgba(0,0,0,.6);}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,4,4,.93);text-align:center;padding:20px;}
.hidden{display:none !important;}
h1{font-size:clamp(26px,6vw,50px);letter-spacing:6px;color:var(--accent2);text-shadow:0 0 12px var(--accent);margin:0 0 2px;}
.sub{color:#998;font-size:12px;letter-spacing:2px;}
button{font-family:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:10px 24px;font-size:14px;letter-spacing:2px;cursor:pointer;min-width:220px;}
button:hover{background:var(--accent);border-color:var(--accent2);}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;}
.bar{width:150px;height:14px;background:#000;border:1px solid var(--line);position:relative;}
.bar i{display:block;height:100%;width:0%;background:var(--hp);}
#expbar i{background:var(--exp);}
.barlabel{font-size:10px;color:#ccc;margin-bottom:2px;letter-spacing:1px;}
#pauseBtn{pointer-events:auto;background:var(--panel);border:1px solid var(--line);color:var(--text);width:30px;height:30px;padding:0;min-width:0;font-size:13px;}
#timer{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;color:#ccc;letter-spacing:1px;}
.statline{font-size:13px;color:#cbbfa8;}
#rebindNote{font-size:11px;color:var(--accent2);min-height:16px;}
#expwrap{position:absolute;top:40px;left:50%;transform:translateX(-50%);}
#historyList{max-height:220px;overflow-y:auto;width:260px;}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="800" height="450"></canvas>
<div id="hud" class="hidden">
  <div><div class="barlabel">HEALTH</div><div class="bar" id="hpbar"><i></i></div></div>
  <div id="timer">0:00</div>
  <button id="pauseBtn">⏸</button>
</div>
<div id="expwrap" class="hidden">
  <div class="barlabel" style="text-align:center;">LVL <span id="lvl">1</span></div>
  <div class="bar" id="expbar" style="width:220px;"><i></i></div>
</div>

<div id="menu" class="screen">
  <h1>DAZED</h1>
  <div class="sub">he keeps fighting a war that already ended</div>
  <div class="sub">A / D to move &nbsp;·&nbsp; SPACE to attack &nbsp;·&nbsp; SHIFT to dash</div>
  <div class="statline" id="bestLine"></div>
  <button id="btnStart">START GAME</button>
  <button id="btnHistory">RUN HISTORY</button>
  <button id="btnOptions">OPTIONS</button>
  <button id="btnQuit">QUIT GAME</button>
</div>

<div id="historyScreen" class="screen hidden">
  <h1 style="font-size:26px;">RUN HISTORY</h1>
  <div id="historyList"></div>
  <button id="btnHistoryBack">BACK</button>
</div>

<div id="options" class="screen hidden">
  <h1 style="font-size:26px;">OPTIONS</h1>
  <div class="statline">Move Left: A &nbsp; Move Right: D</div>
  <div class="statline">Attack key: <span id="attackKeyLabel">SPACE</span></div>
  <button id="btnRebind">REBIND ATTACK KEY</button>
  <div class="statline">Dash key: <span id="dashKeyLabel">SHIFT</span></div>
  <button id="btnRebindDash">REBIND DASH KEY</button>
  <div id="rebindNote"></div>
  <button id="btnOptionsBack">BACK</button>
</div>

<div id="pause" class="screen hidden">
  <h1 style="font-size:28px;">PAUSED</h1>
  <button id="btnResume">RESUME RUN</button>
  <button id="btnPauseOptions">OPTIONS</button>
  <button id="btnQuitRun">QUIT RUN</button>
</div>

<div id="gameover" class="screen hidden">
  <h1 style="font-size:32px;color:var(--accent);">YOU WERE FOUND</h1>
  <div class="statline" id="goStats"></div>
  <button id="btnRestart">RUN AGAIN</button>
  <button id="btnMenu">MAIN MENU</button>
</div>
</div>

const ROOM_SECONDS = 30;
const DASH_DIST = 200, DASH_TIME = 0.40, DASH_COOLDOWN = 0.5;

let best=null, history=[];
try{ best=JSON.parse(localStorage.getItem('dazed_best')||'null'); history=JSON.parse(localStorage.getItem('dazed_history')||'[]'); }catch(e){}
let attackKey='Space';
try{ attackKey=localStorage.getItem('dazed_attackkey')||'Space'; }catch(e){}
let dashKey='ShiftLeft';
try{ dashKey=localStorage.getItem('dazed_dashkey')||'ShiftLeft'; }catch(e){}

function fmtTime(s){ s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function keyLabel(k){ return k.replace('Key','').replace('Arrow','').replace('ShiftLeft','SHIFT').replace('ShiftRight','SHIFT').replace('Space','SPACE').toUpperCase(); }

function renderMenu(){ document.getElementById('bestLine').textContent = best ? ('Best run: '+fmtTime(best.time)+' — Level '+best.level) : 'No runs yet.'; }
function renderHistory(){
  const el=document.getElementById('historyList'); el.innerHTML='';
  const sorted=history.slice().sort((a,b)=>b.time-a.time);
  if(!sorted.length){ el.innerHTML='<div class="statline">No runs recorded.</div>'; return; }
  sorted.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='statline'; d.style.padding='3px 0'; d.style.borderBottom='1px solid var(--line)';
    d.textContent=(i===0?'★ ':'  ')+fmtTime(r.time)+'  Lv'+r.level+'  '+r.kills+' kills';
    el.appendChild(d);
  });
}

const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=canvas.width, H=canvas.height, GROUND=H, SPRITE_H=150;

let keys={}, state='menu', optionsFrom='menu', rebinding=false, rebindTarget='attack';
let player, zombies, exp, level, expNeed, hp, maxHp, dmg, t, killCount, spawnTimer, spawnInterval;
let currentRoomIdx=0, roomT=0, lastStartRoom=-1;
let trans=null, exitReady=false;

function pickNextRoom(excludeIdx){
  if(SPR.bgs.length<=1) return 0;
  let idx;
  do{ idx=Math.floor(Math.random()*SPR.bgs.length); }while(idx===excludeIdx);
  return idx;
}

function resetGame(){
  player={x:W/2, facing:1, animFrame:0, animT:0, attacking:false, attackT:0, moving:false, dashing:false, dashT:0, dashCD:0, dashFromX:0, dashToX:0};
  zombies=[]; exp=0; level=1; expNeed=5; maxHp=100; hp=maxHp; dmg=18;
  t=0; killCount=0; spawnTimer=0; spawnInterval=2.4;
  currentRoomIdx=pickNextRoom(lastStartRoom); lastStartRoom=currentRoomIdx; roomT=0; exitReady=false; trans=null;
}
function show(id,on){ document.getElementById(id).classList.toggle('hidden', !on); }

function startGame(){
  resetGame(); state='playing';
  show('menu',false); show('historyScreen',false); show('options',false); show('pause',false); show('gameover',false);
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('expwrap').classList.remove('hidden');
}
function endGame(){
  state='gameover';
  const run={time:t, level:level, kills:killCount};
  history.push(run); if(history.length>20) history=history.slice(-20);
  if(!best || run.time>best.time) best=run;
  try{ localStorage.setItem('dazed_best', JSON.stringify(best)); localStorage.setItem('dazed_history', JSON.stringify(history)); }catch(e){}
  document.getElementById('goStats').innerHTML='Survived '+fmtTime(t)+'<br>Level '+level+' — '+killCount+' hallucinations put down';
  show('gameover',true);
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('expwrap').classList.add('hidden');
}

window.addEventListener('keydown', e=>{
  if(rebinding){
    if(rebindTarget==='attack'){
      attackKey=e.code;
      try{ localStorage.setItem('dazed_attackkey', attackKey); }catch(err){}
      document.getElementById('attackKeyLabel').textContent=keyLabel(attackKey);
    } else {
      dashKey=e.code;
      try{ localStorage.setItem('dazed_dashkey', dashKey); }catch(err){}
      document.getElementById('dashKeyLabel').textContent=keyLabel(dashKey);
    }
    document.getElementById('rebindNote').textContent='Saved.';
    rebinding=false; return;
  }
  keys[e.code]=true;
  if(state==='playing' && e.code===attackKey){ tryAttack(); e.preventDefault(); }
  if(state==='playing' && e.code===dashKey){ tryDash(); e.preventDefault(); }
  if((state==='playing'||state==='paused') && e.code==='Escape') togglePause();
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

function togglePause(){
  if(state==='playing'){ state='paused'; show('pause',true); }
  else if(state==='paused'){ state='playing'; show('pause',false); }
}

function tryAttack(){
  if(trans) return;
  if(player.attacking || player.dashing) return;
  player.attacking=true; player.attackT=0; player.animFrame=0; player.animT=0;
  const range=95;
  zombies.forEach(z=>{
    if(z.dead) return;
    const d=z.x-player.x;
    if(Math.abs(d)<range && Math.sign(d||1)===player.facing){
      z.hp-=dmg; z.hitFlash=0.15;
      if(z.hp<=0 && !z.dead){ z.dead=true; killCount++; gainExp(3+Math.floor(level*0.75)); }
    }
  });
}
function tryDash(){
  if(trans) return;
  if(player.dashing || player.dashCD>0 || player.attacking) return;
  const dir=player.facing, from=player.x;
  const to=Math.max(30, Math.min(W-30, from+dir*DASH_DIST));
  player.dashing=true; player.dashT=0; player.dashFromX=from; player.dashToX=to;
  player.dashCD=DASH_COOLDOWN;
}
function gainExp(n){
  exp+=n;
  while(exp>=expNeed){ exp-=expNeed; level++; expNeed=Math.floor(expNeed*1.35)+2; maxHp+=15; hp=Math.min(maxHp,hp+15); dmg+=4; }
}
function spawnZombie(){
  const fromRight = Math.random()<0.65 || t<8;
  const x = fromRight ? W+30 : -30;
  const hpScale = 1 + t/45 + level*0.08;
  zombies.push({x, hp:Math.round(26*hpScale), speed:34+Math.min(40,t*0.6)+Math.random()*14, animFrame:0, animT:0, dead:false, hitFlash:0, biteT:0});
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='playing') update(dt);
  draw();
  requestAnimationFrame(loop);
}

function startTransition(){
  trans={phase:'out', fade:0};
  player.attacking=false; player.dashing=false; player.animFrame=0; player.animT=0;
}
function updateTransition(dt){
  player.facing=1; player.moving=true;
  player.animT+=dt;
  if(player.animT>0.11){ player.animT=0; player.animFrame=(player.animFrame+1)%SPR.walk.length; }
  player.x += 150*dt;

  if(trans.phase==='out'){
    // fade follows the player walking off-screen
    trans.fade=Math.min(1,(player.x-(W-30))/90);
    if(trans.fade>=1){
      currentRoomIdx=pickNextRoom(currentRoomIdx);   // background swaps here, under black
      zombies=[];                                    // all enemies removed
      spawnTimer=0; roomT=0; exitReady=false;
      player.x=-60;                                  // teleport to the left
      trans.phase='in';
    }
  } else {
    trans.fade=Math.max(0, 1-(player.x+60)/120);     // fade back in as they walk on
    if(player.x>=60){ trans=null; player.moving=false; }
  }
}

function update(dt){
  t+=dt;
  document.getElementById('timer').textContent=fmtTime(t);

  if(player.dashCD>0) player.dashCD-=dt;

  if(trans){
    updateTransition(dt);
  } else if(player.dashing){
    player.dashT+=dt;
    const p=Math.min(1, player.dashT/DASH_TIME);
    player.x = player.dashFromX + (player.dashToX-player.dashFromX)*p;
    player.moving=false;
    if(p>=1) player.dashing=false;
  } else {
    let vx=0;
    if(keys['KeyA']||keys['ArrowLeft']) vx-=1;
    if(keys['KeyD']||keys['ArrowRight']) vx+=1;
    player.moving = vx!==0;
    if(vx!==0) player.facing = vx>0?1:-1;
    player.x += vx*150*dt;
    if(exitReady && player.x >= W-30){ startTransition(); }   // reached the edge
    else player.x = Math.max(30, Math.min(W-30, player.x));
  }

  if(player.attacking){
    player.attackT+=dt; player.animT+=dt;
    if(player.animT>0.045){ player.animT=0; player.animFrame++; }
    if(player.attackT>0.38 || player.animFrame>=SPR.dash.length){ player.attacking=false; player.animFrame=0; }
  } else if(player.moving){
    player.animT+=dt;
    if(player.animT>0.11){ player.animT=0; player.animFrame=(player.animFrame+1)%SPR.walk.length; }
  }

  const period=Math.floor(t/ROOM_SECONDS);
  if(!trans){ roomT+=dt; if(roomT>=ROOM_SECONDS) exitReady=true; }

  if(!trans) spawnTimer+=dt;
  const curInterval=Math.max(0.55, spawnInterval - t*0.012)*2;
  if(!trans && spawnTimer>curInterval){ spawnTimer=0; spawnZombie(); }

  zombies.forEach(z=>{
    if(z.dead) return;
    z.animT+=dt;
    if(z.animT>0.14){ z.animT=0; z.animFrame=(z.animFrame+1)%SPR.zomb.length; }
    if(z.hitFlash>0) z.hitFlash-=dt;
    const d=player.x-z.x, ad=Math.abs(d);
    if(ad>46){ z.x += Math.sign(d)*z.speed*dt; }
    else if(!player.dashing && !trans){ z.biteT+=dt; if(z.biteT>0.8){ z.biteT=0; hp-=7; } }
  });
  zombies = zombies.filter(z=>!z.dead);
  if(zombies.length>40) zombies.shift();

  if(hp<=0){ hp=0; endGame(); }

  document.querySelector('#hpbar i').style.width=Math.max(0,(hp/maxHp*100))+'%';
  document.querySelector('#expbar i').style.width=(exp/expNeed*100)+'%';
  document.getElementById('lvl').textContent=level;
}

function drawSprite(sp,x,groundY,facing){
  if(!sp || !sp.complete || !sp.naturalWidth) return;
  const h=SPRITE_H, w=sp.naturalWidth*(h/sp.naturalHeight);
  ctx.save(); ctx.translate(x,groundY); ctx.scale(facing,1);
  ctx.drawImage(sp,-w/2,-h,w,h);
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const curBg = SPR.bgs[currentRoomIdx];
  if(curBg.complete) ctx.drawImage(curBg,0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(0,0,W,H);
  if(state==='menu'||state==='options'||state==='history') return;

  zombies.forEach(z=>{
    const sp=SPR.zomb[z.animFrame % SPR.zomb.length];
    const facing=(player.x<z.x)?1:-1;
    ctx.save();
    if(z.hitFlash>0) ctx.filter='brightness(2) saturate(0)';
    drawSprite(sp,z.x,GROUND,facing);
    ctx.restore();
  });
  let pset, pframe;
  if(player.dashing){
    pset=SPR.dash; pframe=Math.min(SPR.dash.length-1, Math.floor((player.dashT/DASH_TIME)*SPR.dash.length));
  } else if(player.attacking){
    pset=SPR.dash; pframe=Math.min(player.animFrame,pset.length-1);
  } else {
    pset=SPR.walk; pframe=player.moving?player.animFrame:0;
  }
  drawSprite(pset[pframe], player.x, GROUND, player.facing);
  if(trans){ ctx.fillStyle='rgba(0,0,0,'+trans.fade+')'; ctx.fillRect(0,0,W,H); }
  else if(exitReady){   // pulsing hint that the right edge is open
    const a=0.3+0.2*Math.sin(performance.now()/250);
    ctx.fillStyle='rgba(201,162,39,'+a+')'; ctx.fillRect(W-8,0,8,H);
}
}

document.getElementById('btnStart').onclick=startGame;
document.getElementById('btnHistory').onclick=()=>{ renderHistory(); show('menu',false); show('historyScreen',true); };
document.getElementById('btnHistoryBack').onclick=()=>{ show('historyScreen',false); show('menu',true); };
document.getElementById('btnOptions').onclick=()=>{ optionsFrom='menu'; show('menu',false); show('options',true); document.getElementById('attackKeyLabel').textContent=keyLabel(attackKey); document.getElementById('dashKeyLabel').textContent=keyLabel(dashKey); };
document.getElementById('btnOptionsBack').onclick=()=>{ show('options',false); if(optionsFrom==='menu') show('menu',true); else show('pause',true); };
document.getElementById('btnRebind').onclick=()=>{ rebinding=true; rebindTarget='attack'; document.getElementById('rebindNote').textContent='Press any key…'; };
document.getElementById('btnRebindDash').onclick=()=>{ rebinding=true; rebindTarget='dash'; document.getElementById('rebindNote').textContent='Press any key…'; };
document.getElementById('btnQuit').onclick=()=>{ document.getElementById('btnQuit').textContent='CLOSE THIS TAB TO QUIT'; };

document.getElementById('pauseBtn').onclick=togglePause;
document.getElementById('btnResume').onclick=togglePause;
document.getElementById('btnPauseOptions').onclick=()=>{ optionsFrom='pause'; show('pause',false); show('options',true); document.getElementById('attackKeyLabel').textContent=keyLabel(attackKey); document.getElementById('dashKeyLabel').textContent=keyLabel(dashKey); };
document.getElementById('btnQuitRun').onclick=()=>{ show('pause',false); endGame(); };

document.getElementById('btnRestart').onclick=startGame;
document.getElementById('btnMenu').onclick=()=>{ show('gameover',false); renderMenu(); show('menu',true); };

renderMenu();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
